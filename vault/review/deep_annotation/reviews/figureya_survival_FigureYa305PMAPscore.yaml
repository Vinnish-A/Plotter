false_positive_risks:
- Do not retrieve this as a heatmap despite metadata/card heatmap hints.
- Do not treat source, target, or weight as network fields; they are compatibility placeholders.
- Do not assume the one-row CSV can regenerate the observed KM curve or risk table.
- Do not infer PMAPscore biology beyond the visible multiple_score high/low labels and Rmd naming.
- The top legend is clipped at the right edge in rebuilt.png, so legend text should be checked before reuse.
best_for:
- Inspiration for a two-stratum Kaplan-Meier survival figure with censor ticks and a number-at-risk table.
- Cases needing survival probability over time with a compact statistical annotation.
- Visual reference for aligning risk-table columns under the main time axis.
bad_for:
- Heatmaps, ComplexHeatmap compositions, oncoplots, ROC plots, or network diagrams.
- Clean-session recomputation from the current CSV interface.
- Assets requiring encoded confidence intervals or patient-level survival data.
style_notes:
- White background with black axes, large axis titles, and minimal grid-free survival plotting.
- Red and cyan strata are used consistently for curves, censor ticks, legend keys, and risk-table labels.
- Main plot and risk table share time ticks from 0 to about 50.
- The legend placement appears too wide for the canvas and is clipped on the right.
