false_positive_risks:
- Do not retrieve this as a complete data-driven scatter or PCA plot; the final visual is a four-panel conceptual illustration.
- Do not treat empty label, trajectory, or color columns as available annotation or styling data.
- Do not treat the constant panel column as evidence that the CSV controls the four visible panels.
- Do not infer network roles; source, target, and weight columns are absent and the arrows are explanatory vectors, not graph edges.
- Rebuild is a case-level rendered-output fallback, so CSV edits will not regenerate the visible layout.
best_for:
- Inspiration for explaining multiple geometric operations on points, manifolds, or embeddings in one wide figure.
- Reusing the composition idea of shaded spatial bodies plus directional arrows, local callouts, and bottom legends.
- Cases where explanatory visual grammar matters more than data-complete regeneration.
bad_for:
- Fully data-driven rebuilds from a single CSV.
- Standard scatter, PCA, UMAP, or network diagrams.
- Tasks requiring all labels, arrows, colors, and panel layouts to be controlled through the standardized CSV interface.
- Dense quantitative plots where axes, ticks, or exact measurements are central.
style_notes:
- Uses restrained gray bodies with red as the dominant action color, purple as a secondary vector family, and cyan for the no-action contrast.
- Text is large and readable, but several callouts sit inside panels and depend on available empty space.
- The visual has no panel letters; each panel relies on its own legend/callouts for interpretation.
- The third panel is the only visible 3D axis system; the other panels suppress axes entirely.
