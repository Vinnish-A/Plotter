false_positive_risks:
- Do not treat this as a map asset despite the machine card saying map/map; the inspected image is a grouped bar chart.
- Do not infer network roles; there are no source, target, or weight columns and no network marks.
- Do not infer a stacked bar or line-combo figure from stack or line_value columns; those layers are not visible.
- The canonical data_main.csv is a compact abstract/demo interface and does not encode the full twelve-bar nested source figure.
- The current plot.py calls a generic matplotlib renderer, while the inspected PNG matches the richer R/ggplot2 plus legendry source rebuild.
best_for:
- Grouped bar summaries with individual replicate points and error bars.
- Figures where x-axis nesting carries multiple categorical annotations without a separate legend.
- Teaching or reusing the visual pattern of colored supergroup bands plus subgroup brackets under a bar chart.
bad_for:
- Stacked bars, line overlays, or network-like relationship diagrams.
- Cases where every visible category hierarchy must be recoverable from the current data_main.csv alone.
- Dense category sets with long labels, because the nested axis annotation would crowd quickly.
style_notes:
- High-contrast warm and teal palette separates the two top-level groups, with darker/lighter tones for subgroups.
- Large y-axis title and large nested x labels make the figure readable at preview size.
- No top title is present in the rendered chart; the visual identity comes from the y label and nested x annotations.
- The bottom KP-O/KP-Y color bands function as both annotation and legend substitute.
