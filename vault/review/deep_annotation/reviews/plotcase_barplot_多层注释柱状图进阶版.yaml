observed_visual_grammar:
  family: grouped_summary_bar_chart
  panel_structure: one panel with twelve bars arranged into two colored supergroups and three middle-level groups per supergroup
  primary_marks: mean bars with black outlines
  overlays: jittered replicate points and vertical error bars
  annotation_structure: nested x-axis labels and bracket rails replace a conventional legend
  visible_measure: Lung metastasis burden (%)
inferred_visual_grammar:
  source: model_review_of_image_and_code
  geometry: grouped bar summary with replicate overlay
  subtype: nested-axis annotated bar plot
  likely_data_flow: raw replicate rows are summarized to bar means and standard errors, then grouped by a composite x_id made from type, group1, and group2
  weak_semantic_interpretations:
  - The plus/minus x labels are probably treatment or condition states because the R code names them dox_levels, but the image itself only exposes '-' and '+'.
  - EV, Atf4-1, Atf4-2, KP-O, and KP-Y are treated as displayed group labels, not interpreted biological mechanisms.
reviewed_visual_roles:
  x_position: composite categorical slot ordered by type within group1 within group2
  y_value: quantitative burden percentage plotted as bar height and point height
  bar_height: mean of replicate Counts within each composite category in the original R source
  error_interval: mean_se error bars computed from replicate Counts by stat_summary
  point_overlay: individual replicate Counts jittered horizontally inside each bar slot
  fill_color: composite group2.group1 palette key in the original code; visually also separates KP-O/KP-Y and subgroup tones
  point_shape: group2 in the original code, though no standalone legend is drawn
  nested_axis_labels: type level, group1 level, and group2 colored band/bracket level
