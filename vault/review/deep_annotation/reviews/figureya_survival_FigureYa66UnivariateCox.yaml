false_positive_risks: &id004
- Current dossier incorrectly labels the asset as scatter/pca_or_manifold.
- Metadata visual_keywords include 3d_manifold, which is not visible in rebuilt.png.
- Do not treat x/y/value/source/target/weight compatibility columns as visual evidence.
- Current lower/upper in data_main.csv are not the Cox confidence intervals used in the figure.
best_for:
- Reusable univariate Cox forest plot with gene labels, hazard ratios, confidence intervals, and p-value
  color scale.
- Examples needing a dashed null reference line at HR=1 and log-scaled hazard-ratio axis.
bad_for:
- 3D manifold, PCA, scatter, network, line, or survival-curve retrieval.
- Cases where only x/y/value compatibility columns are available.
style_notes: &id006
- White background with minimal grid.
- Thick black horizontal confidence intervals.
- Diamond point estimates colored by viridis p-value scale.
- Vertical colorbar labeled P value.
