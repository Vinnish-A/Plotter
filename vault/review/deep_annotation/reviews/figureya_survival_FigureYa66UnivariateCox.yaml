  ci_lower: horizontal interval low from lower
  ci_upper: horizontal interval high from upper
  p_value: point color scale from pvalue
  z: source statistic available but not visibly drawn
  source: compatibility column only; not a relationship role
  target: compatibility column only; not a relationship role
  weight: compatibility column only; not a relationship role
