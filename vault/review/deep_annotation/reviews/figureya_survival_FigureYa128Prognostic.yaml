false_positive_risks:
- Metadata and card label the asset as heatmap/annotated_heatmap, but the reviewed image is an AUC/ROC/KM survival composite.
- Current data_main.csv is a generic compatibility table and does not encode the panel-specific survival grammar.
- plot.py delegates to the generic line renderer; running it would not reproduce the reviewed three-panel image.
- source, target, and weight are compatibility duplicates of x/y/value, not network roles.
- lower and upper look interval-like but are not visible uncertainty encodings in the reviewed output.
- The accepted image is a case-level fallback because the precomputed lasso_fea.rda object is unavailable.
best_for:
- Inspiration for compact prognostic-model evaluation layouts combining feature-selection AUC, ROC, and Kaplan-Meier survival evidence.
- Reusing visual composition ideas for risk-stratified survival summaries when panel-specific data can be supplied explicitly.
- Cases needing clear inline performance annotations and a small survival legend in a wide horizontal figure.
bad_for:
- Heatmaps, annotated matrices, networks, or any retrieval that depends on source/target/weight semantics.
- Fully reproducible source-code rebuilds from the current standardized CSV alone.
- Automated remapping unless the caller can provide separate AUC trajectory, ROC, and survival curve data tables.
style_notes:
- Wide 3:1 layout uses three equally weighted base-plot panels with generous whitespace.
- Blue carries model-performance curves and low-risk survival; red marks the selected peak and high-risk survival.
- 'Text annotations are sparse but semantically important: selected gene count/AUC, ROC AUC, risk legend, and log-rank p-value.'
- The final image has no main title; panel identity is carried by axes and annotations.
