false_positive_risks: &id003
- Genome columns are schema-compatible but synthetic.
- rebuilt.png matches only because it is a case-level cover fallback.
- plot.py would not regenerate the observed gene-arrow figure from data_main.csv.
- Empty link_id/similarity columns do not prove synteny or homology-link support.
best_for:
- Visual inspiration for two-track gene cluster diagrams with directional arrows and functional-class
  legend.
bad_for:
- Core reusable genome-structure template or clean CSV-to-figure rebuild testing.
style_notes: &id005
- Sparse axis-free white layout with grey baselines, outlined colored gene arrows, italic labels, and
  right-side scale bars.
