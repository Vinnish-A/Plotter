inferred_visual_grammar:
  grammar_id: two_track_gene_cluster_structure
  true_source_grammar: geneviewer GC_chart over source cluster data
  current_standard_grammar: synthetic oriented feature table plus generic scatter-compatible plot entry
  mismatch: standard columns are plausible but current values and plot entry do not reproduce the observed
    geneviewer grammar
reviewed_visual_roles: &id004
  segment_id: cluster/segment role; current values are synthetic
  feature_id: gene identifier; current values are placeholders
  start: genomic start coordinate; current values are synthetic
  end: genomic end coordinate; current values are synthetic
  strand: arrow direction
  feature_class: functional class color; current values do not preserve observed legend
  label: gene label; current values are placeholders
  link_id: empty optional field; no synteny/link marks observed
  similarity: empty optional field; no similarity ribbons observed
canonical_columns:
- segment_id
- feature_id
- start
- end
- strand
- feature_class
- cluster
- label
required_data_semantics:
  segment_id: gene cluster or track identity
  feature_id: gene identifier
  start: feature start coordinate
  end: feature end coordinate
  strand: feature direction
  feature_class: functional class mapped to color
  label: displayed gene name
optional_data_semantics:
  species_footer: cluster footer text
  locus_subtitle: locus subtitle text
  legend_class_labels: functional class legend labels
  class_palette: functional class color palette
  scale_bar_position: scale bar placement
  cluster_reverse_flag: reverse direction for a track
optional_modules:
