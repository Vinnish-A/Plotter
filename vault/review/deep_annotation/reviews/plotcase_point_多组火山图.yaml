false_positive_risks: &id004
- Do not treat current generic x/y/value/size_value/threshold/facet/highlight fields as complete evidence
  for the observed grammar.
- Do not retrieve as a classic volcano plot unless categorical multi-group x layout is acceptable.
- Current plot.py calls a generic scatter renderer and does not express the observed R grammar.
best_for:
- Multi-cluster differential-expression effect-size displays.
- Comparing upregulated and downregulated genes across categorical groups.
- Wide strip-style plots with per-group bands and selected labels.
bad_for:
- Classic two-axis volcano plots using -log10 p-value.
- Bubble charts or size-encoded scatterplots.
- Generic continuous x-y scatter without categorical group bands.
style_notes: &id006
- Use red/blue points for up/down sign classes.
- Muted vertical bands and saturated center strips define cluster structure.
- Keep selected gene labels sparse and repel them from marks.
