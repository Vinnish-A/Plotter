  hazard_ratio: numeric estimate plotted on hazard-ratio axis
  ci_lower: numeric left confidence interval endpoint
  ci_upper: numeric right confidence interval endpoint
  p_value: numeric or formatted statistical value shown in table
  endpoint: survival endpoint filter; OS in rebuilt output
