  layout: one row of three axis-free panels
  marks:
  - gray shaded circular hemisphere backgrounds
  - blue circular points with black outlines
  - black dashed radial spokes
  encodings:
    panel: three point-dispersion patterns
    point_position: 2D projected location
    spoke: connection from point to central reference
  subtype: abstract_dispersion_spoke_diagram
