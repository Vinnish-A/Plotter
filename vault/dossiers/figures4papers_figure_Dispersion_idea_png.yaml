      status: not_supported_by_observed_output
    trajectories:
      status: not_supported_by_observed_output
    true_3d_surface:
      status: not_supported_by_standard_entry
    direct_png_fallback:
      status: active
      source: outputs/figure.png
  false_positive_risks:
  - Do not treat data_main x/y/z/value as plotted random point data.
  - Do not retrieve this as empirical PCA, manifold learning, or true 3D scatter.
  - Blank label, trajectory, and color columns are not available optional modules.
  - Visual check only proves nonblank image properties, not semantic rebuild fidelity.
reviewed_visual_roles:
  panel_id: panel assignment for three dispersion examples
  point_x: projected point coordinate in raw script; absent from data_main
  point_y: projected point coordinate in raw script; absent from data_main
  connector_origin: hardcoded shared radial reference
  hemisphere_background: computed shaded background; not CSV-driven
  x: synthetic grid column; false positive if treated as plotted point x
  y: synthetic grid column; false positive if treated as plotted point y
  z: synthetic radial value; not visible as 3D axis
  label: blank; no label layer
  trajectory: blank; no trajectory layer
  color: blank; point colors hardcoded
