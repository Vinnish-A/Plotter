type: object
required:
  - case_id
  - annotation_version
  - annotation_status
  - annotator_model
  - reviewed_at
  - evidence
  - observed_visual_grammar
  - inferred_visual_grammar
  - reviewed_visual_roles
  - canonical_columns
  - required_data_semantics
  - optional_data_semantics
  - optional_modules
  - false_positive_risks
  - best_for
  - bad_for
  - style_notes
  - retrieval_tier_recommendation
  - confidence
  - image_observation
  - data_understanding
  - code_understanding
properties:
  case_id:
    type: string
  annotation_version:
    type: string
  annotation_status:
    type: object
  annotator_model:
    type: string
  reviewed_at:
    type: string
  evidence:
    type: object
  observed_visual_grammar:
    type: object
  inferred_visual_grammar:
    type: object
  reviewed_visual_roles:
    type: object
  canonical_columns:
    type: array
    items:
      type: string
  required_data_semantics:
    type: object
  optional_data_semantics:
    type: object
  optional_modules:
    type: object
  false_positive_risks:
    type: array
    items:
      type: string
  best_for:
    type: array
    items:
      type: string
  bad_for:
    type: array
    items:
      type: string
  style_notes:
    type: array
    items:
      type: string
  retrieval_tier_recommendation:
    type: object
    required:
      - tier
      - rationale
    properties:
      tier:
        enum: [core, support, inspiration, archive]
      rationale:
        type: string
      exclusion_risks:
        type: array
        items:
          type: string
  confidence:
    type: object
  image_observation:
    type: object
    required:
      - image_read
      - panel_count
      - layout
      - marks
      - encodings
      - axes
      - legends
      - annotations
      - text_density
      - visual_risks
    properties:
      image_read:
        type: boolean
      panel_count: {}
      layout: {}
      marks: {}
      encodings: {}
      axes: {}
      legends: {}
      annotations: {}
      text_density: {}
      visual_risks: {}
  data_understanding:
    type: object
    required:
      - data_read
      - observed_columns
      - role_mapping
      - derived_columns
      - false_positive_columns
      - missing_optional_data
    properties:
      data_read:
        type: boolean
      observed_columns: {}
      role_mapping: {}
      derived_columns: {}
      false_positive_columns: {}
      missing_optional_data: {}
  code_understanding:
    type: object
    required:
      - code_read
      - backend
      - entry_behavior
      - hardcoded_aesthetics
      - output_behavior
      - unsupported_features
    properties:
      code_read:
        type: boolean
      backend: {}
      entry_behavior: {}
      hardcoded_aesthetics: {}
      output_behavior: {}
      unsupported_features: {}
  proposed_metadata_patch:
    type: object
  proposed_dossier_patch:
    type: object
