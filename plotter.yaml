project:
  name: The Plotter
  purpose: external_visual_cognition_system
  machine_entry: metadata.json
  agent_entry: agent_guide.md
  generation_preferences: styles/supervisor_image_generation_preferences.md

modules:
  cabal:
    role: decision_routing_scoring_review
    tools: cabal/tools
  vault:
    role: accepted_asset_memory_and_template_archive
    material_root: vault/material
  graft:
    role: foreign_code_normalization
    intake_root: graft/intake
    tools: graft/tools
  bastard:
    role: compact_visual_grammar_recombination_and_mutation_planning
    skill: bastard/SKILL.md
    grammar: bastard/grammar
    tests: bastard/tests
  retinue:
    role: execution_rendering_export
    tools: retinue/tools
    generated: retinue/generated

surfaces:
  ui:
    role: vault_retinue_preview_and_manual_review_surface
    root: ui

admission_pipeline:
  - cabal_scene_card
  - graft_intake
  - retinue_rebuild
  - cabal_review
  - vault_admission

closed_loop:
  - cabal_scene_card
  - retinue_data_probe
  - vault_dossier_retrieval
  - cabal_data_fit_and_recommendation
  - bastard_generation_when_needed
  - retinue_render_and_visual_check
  - cabal_final_score
  - vault_memory_return

material_contract:
  root: vault/material
  invariant: every case under vault/material is unfolded live material; folded memory lives under vault/folded_assets
  main_csv: data_main.csv
  optional_csv: data_optional.csv
  standard_outputs:
    - outputs/rebuilt.png
  optional_outputs:
    - outputs/rebuilt.pdf
  manifests:
    - manifests/intake_manifest.json
    - manifests/rebuild_manifest.json
    - manifests/visual_audit.json
    - manifests/cabal_review.json
  statuses:
    - pending
    - standardized
    - build_success
    - build_failed
    - custom_required
    - dependency_missing
  vault_status:
    live: boolean
    folded: boolean
    restored_from_fold: boolean
    canonical_case: string_or_null
  rebuild_class:
    source_code_rebuild: boolean
    generic_renderer_rebuild: boolean
    case_level_fallback: boolean
    synthetic_data: boolean
  complexity_modes:
    low: data_main.csv only
    medium: data_main.csv plus common module composition
    high: data_main.csv plus data_optional.csv and multilayer or multipanel output
    custom: raw resources, manual coordinates, hardcoded annotations, or special assets required
